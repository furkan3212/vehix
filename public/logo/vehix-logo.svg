<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vehixGradient" x1="20" y1="20" x2="155" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="215" y1="45" x2="510" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- VEHIX identity mark -->
  <g transform="translate(12 12)">
    <!-- subtle open vehicle/identity arc -->
    <path d="M18 64C38 32 70 18 103 18C125 18 143 24 158 36"
          stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

    <!-- primary V/check mark -->
    <path d="M35 55L70 119L87 139L105 119L158 40"
          stroke="url(#vehixGradient)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- clean inner highlight -->
    <path d="M37 56L69 113"
          stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"
          stroke-linecap="round"/>

    <!-- identity/network point -->
    <circle cx="158" cy="40" r="7" fill="#22D3EE"/>
    <circle cx="158" cy="40" r="13" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="205" y="103"
        fill="url(#textGradient)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="8">VEHIX</text>

  <!-- Tagline -->
  <text x="210" y="137"
        fill="#60A5FA"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="5">SMART VEHICLE IDENTITY</text>
</svg>